[project]
name = "regimelab"
version = "0.4.0"
description = "Institutional market-regime detection engine: HMM/Hamilton regime switching, PCA absorption ratio, VIX term structure, point-in-time backtesting and automated reporting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pedro Castejon"}
]
keywords = [
    "quantitative-finance",
    "regime-detection",
    "hidden-markov-model",
    "systemic-risk",
    "backtesting",
    "point-in-time",
    "absorption-ratio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "hmmlearn>=0.3.3",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "platformdirs>=4.11.5",
    "plotly>=6.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "typer>=0.27.2",
    "yfinance>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/AlgorithmicMind/regimelab"
Repository = "https://github.com/AlgorithmicMind/regimelab"
Issues = "https://github.com/AlgorithmicMind/regimelab/issues"

[project.scripts]
regimelab = "regimelab.cli:app"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regimelab"]

[tool.hatch.build.targets.sdist]
include = ["src/regimelab", "tests", "docs", "README.md", "CHANGELOG.md", "uv.lock", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # flake8-comprehensions
    "DTZ",         # flake8-datetimez
    "ISC",         # implicit-str-concat
    "PIE",         # flake8-pie
    "PT",          # flake8-pytest-style
    "RET",         # flake8-return
    "SIM",         # flake8-simplify
    "ARG",         # flake8-unused-arguments
    "PD",          # pandas-vet
    "PL",          # pylint
    "NPY",         # numpy-specific
    "PERF",        # perflint
    "RUF",         # ruff-specific
]
ignore = [
    "PLR0913",     # quant functions legitimately take many parameters
    "PLR2004",     # magic values are readable in numerical code
    "ISC001",      # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "hmmlearn.*",
    "statsmodels.*",
    "sklearn.*",
    "scipy.*",
    "plotly.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:hmmlearn.*",
    "ignore::DeprecationWarning:statsmodels.*",
]
markers = [
    "network: test requires live network access (deselect with '-m \"not network\"')",
    "slow: test is slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/regimelab"]
branch = true
parallel = true

[tool.coverage.report]
precision = 1
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
